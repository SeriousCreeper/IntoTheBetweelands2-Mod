# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs = -Xmx3G

# Mod Information
maven_group = com.seriouscreeper
mod_id = bladditions
mod_name = ITBL 2 Addon
mod_version = 1.6.4
archives_base_name = bladditions

version_crafttweaker = 4.1.20.698

# If any properties changes below this line, run `gradlew setupDecompWorkspace` and refresh gradle again to ensure everything is working correctly.

# Boilerplate Options
use_mixins = true
use_coremod = true
use_assetmover = false

# Access Transformer files should be in the root of `resources` folder and with the filename formatted as: `{mod_id}_at.cfg`
use_access_transformer = true

# Coremod Arguments
include_mod = true
coremod_plugin_class_name = com.seriouscreeper.bladditions.core.BLAdditionsLoadingPlugin